services:
  traefik:
    image: traefik:v3.6
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
      - "6969:6969"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - proxy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  maintenance:
    image: nginx:alpine
    container_name: traefik_maintenance
    restart: unless-stopped
    networks:
      - proxy
    expose:
      - "80"
    volumes:
      - ./maintenance/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./maintenance/index.html:/usr/share/nginx/html/index.html:ro
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

networks:
  proxy:
    external: true
